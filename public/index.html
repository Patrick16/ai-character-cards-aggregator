<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Character Card Aggregator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Character Card Aggregator</h1>
  <button id="toggleSettings" class="ghost">Папки назначения</button>
</header>

<section id="settingsPanel" class="panel hidden">
  <h2>Куда сохранять карточки</h2>
  <p class="hint">Добавьте одну или несколько папок — например <code>public/characters</code> у TavernAI 2 или <code>data/default-user/characters</code> у SillyTavern. Путь должен уже существовать.</p>
  <div id="destinationList"></div>
  <form id="addDestinationForm">
    <input type="text" id="destLabel" placeholder="Название (например: TavernAI)">
    <input type="text" id="destPath" placeholder="Абсолютный путь к папке characters" required>
    <button type="submit">Добавить</button>
  </form>
  <p id="settingsError" class="error"></p>
</section>

<section class="searchBar">
  <input type="text" id="query" placeholder="Поиск персонажей на Chub.ai...">
  <select id="sort">
    <option value="download_count">По популярности</option>
    <option value="rating">По рейтингу</option>
    <option value="created_at">Новые</option>
    <option value="trending_downloads">В тренде</option>
    <option value="name">По имени</option>
  </select>
  <label class="nsfwToggle"><input type="checkbox" id="nsfw"> NSFW</label>
  <button id="searchBtn">Искать</button>
</section>

<section id="results" class="grid"></section>
<div id="loadMoreWrap" class="hidden">
  <button id="loadMore">Показать ещё</button>
</div>

<div id="toast" class="toast hidden"></div>

<script src="app.js"></script>
</body>
</html>
